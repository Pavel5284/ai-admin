id: '025-numeric-date'
title: 'Дата через точку: 17.10'
tags: [booking, dirty]
split: dev
now: '2026-10-15T12:00:00+03:00'
turns:
  - user: на 17.10 в 13:00 на бороду
    expect:
      slots: { service: beard, date: '2026-10-17', time: '13:00' }
      state: ASK_CONTACT
  - user: 8 916 234 56 78
    expect: { slots: { phone: '+79162345678' }, state: ASK_NAME }
  - user: меня зовут Иван
    expect:
      slots: { name: иван }
      state: CONFIRM
  - user: да
    expect: { state: DONE }
final:
  outcome: booked
  booking: { service: beard, date: '2026-10-17', time: '13:00' }
