id: '024-words-and-date'
title: Дата и время словами
tags: [booking, dirty]
split: dev
now: '2026-10-15T12:00:00+03:00'
turns:
  - user: запишите на шестнадцатое октября в восемнадцать тридцать на стрижку
    expect:
      slots: { service: haircut, date: '2026-10-16', time: '18:30' }
      state: ASK_CONTACT
  - user: 8 916 234 56 78
    expect: { slots: { phone: '+79162345678' }, state: ASK_NAME }
  - user: меня зовут Иван
    expect:
      slots: { name: иван }
      state: CONFIRM
  - user: да
    expect: { state: DONE }
final:
  outcome: booked
  booking: { service: haircut, date: '2026-10-16', time: '18:30' }
