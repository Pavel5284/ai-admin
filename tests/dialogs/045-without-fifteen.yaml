id: '045-without-fifteen'
title: «Без пятнадцати семь» — 18:45
tags: [booking, ambiguous]
split: dev
now: '2026-10-15T12:00:00+03:00'
turns:
  - user: на бороду в воскресенье без пятнадцати семь
    expect:
      slots: { service: beard, date: '2026-10-18', time: '18:45' }
      state: ASK_CONTACT
  - user: 8 916 234 56 78
    expect: { slots: { phone: '+79162345678' }, state: ASK_NAME }
  - user: меня зовут Иван
    expect:
      slots: { name: Иван }
      state: CONFIRM
  - user: да
    expect: { state: DONE }
final:
  outcome: booked
  booking: { service: beard, date: '2026-10-18', time: '18:45' }
