id: '061-barge-in'
title: Клиент перебивает и сразу называет новое время
tags: [edge, barge-in]
split: dev
now: '2026-10-15T12:00:00+03:00'
turns:
  - user: хочу на стрижку завтра
    expect: { state: ASK_TIME }
  - barge_in: не надо, давайте завтра в 15:00
    expect: { state: ASK_CONTACT, slots: { date: '2026-10-16', time: '15:00' } }
  - user: 8 916 234 56 78
    expect: { state: CONFIRM }
  - user: да
    expect: { state: DONE }
final:
  outcome: booked
  booking: { service: haircut, date: '2026-10-16', time: '15:00' }
