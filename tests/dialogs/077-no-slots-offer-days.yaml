id: '077-no-slots-offer-days'
title: На выбранный день окон нет — предлагаем ближайшие
tags: [edge, slots]
split: dev
now: '2026-10-15T12:00:00+03:00'
turns:
  - user: хочу на детскую стрижку в воскресенье
    expect: { state: ASK_TIME, slots: { service: kids, date: '2026-10-18' } }
  - user: в 12:00
    expect: { state: ASK_DATE, say_contains: 'Ближайшие окна' }
  - user: в понедельник в 13:00
    expect: { state: ASK_CONTACT, slots: { date: '2026-10-19', time: '13:00' } }
  - user: 8 916 234 56 78
    expect: { state: ASK_NAME }
  - user: меня зовут Иван
    expect:
      slots: { name: иван }
      state: CONFIRM
  - user: да
    expect: { state: DONE }
final:
  outcome: booked
  booking: { service: kids, date: '2026-10-19', time: '13:00' }
