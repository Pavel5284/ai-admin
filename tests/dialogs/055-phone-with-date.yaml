id: '055-phone-with-date'
title: Дата, время и телефон в одной реплике
tags: [booking, phone]
split: dev
now: '2026-10-15T12:00:00+03:00'
turns:
  - user: запишите меня на стрижку в пятницу в 17:00, мой номер 8 (916) 234-56-78
    expect:
      slots: { service: haircut, date: '2026-10-16', time: '17:00', phone: '+79162345678' }
      state: CONFIRM
  - user: да
    expect: { state: DONE }
final:
  outcome: booked
  booking: { service: haircut, date: '2026-10-16', time: '17:00' }
