id: '067-change-service-at-confirm'
title: Клиент меняет услугу на подтверждении
tags: [edge, correction]
split: dev
now: '2026-10-15T12:00:00+03:00'
turns:
  - user: хочу на стрижку завтра в 15:00
    expect: { state: ASK_CONTACT }
  - user: 8 916 234 56 78
    expect: { state: ASK_NAME }
  - user: меня зовут Иван
    expect:
      slots: { name: иван }
      state: CONFIRM
  - user: нет
    expect: { say_contains: 'услугу, дату, время' }
  - user: услугу
    expect: { state: ASK_SERVICE }
  - user: борода
    expect: { state: CONFIRM, slots: { service: beard } }
  - user: да
    expect: { state: DONE }
final:
  outcome: booked
  booking: { service: beard, date: '2026-10-16', time: '15:00' }
