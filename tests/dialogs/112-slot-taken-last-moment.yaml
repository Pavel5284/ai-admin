id: '112-slot-taken-last-moment'
title: Слот заняли, пока клиент подтверждал запись
tags: [system-failure, booking, slot-taken]
split: dev
now: '2026-10-15T12:00:00+03:00'
turns:
  - user: хочу детскую стрижку в понедельник в 13:00
    expect: { state: ASK_CONTACT, slots: { service: kids, date: '2026-10-19', time: '13:00' } }
  - user: 8 916 234 56 78
    expect: { state: ASK_NAME }
  - user: меня зовут Иван
    expect:
      slots: { name: иван }
      state: CONFIRM
  - sql: |
      -- Занимаем 13:00 у всех мастеров, которые делают детскую стрижку:
      -- иначе бот честно предложит другого свободного мастера и запишет.
      INSERT INTO bookings (master_id, service_id, starts_at, ends_at, client_name, client_phone)
      SELECT m.id, s.id, '2026-10-19 13:00+03'::timestamptz,
             '2026-10-19 13:00+03'::timestamptz + make_interval(mins => s.duration_min),
             'Тест', '+79160000099'
      FROM masters m
      JOIN master_services ms ON ms.master_id = m.id
      JOIN services s ON s.id = ms.service_id AND s.code = 'kids';
    user: да
    expect: { state: OFFER_SLOTS, say_contains: 'заняли' }
  - user: тогда в 14:00
    expect: { state: CONFIRM, slots: { time: '14:00' } }
  - user: да
    expect: { state: DONE }
final:
  outcome: booked
  booking: { service: kids, date: '2026-10-19', time: '14:00' }
