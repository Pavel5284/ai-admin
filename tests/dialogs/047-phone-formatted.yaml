id: '047-phone-formatted'
title: Телефон в скобках и с дефисами
tags: [booking, phone]
split: dev
now: '2026-10-15T12:00:00+03:00'
turns:
  - user: хочу на стрижку завтра в 18:00
    expect: { state: ASK_CONTACT }
  - user: +7 (916) 234-56-78
    expect: { slots: { phone: '+79162345678' }, state: CONFIRM }
  - user: да
    expect: { state: DONE }
final:
  outcome: booked
  booking: { service: haircut, date: '2026-10-16', time: '18:00' }
