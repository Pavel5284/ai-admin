id: '038-next-week-clarify'
title: «На следующей неделе» — просим уточнить день
tags: [booking, ambiguous]
split: dev
now: '2026-10-15T12:00:00+03:00'
turns:
  - user: хочу на стрижку
    expect: { state: ASK_DATE }
  - user: на следующей неделе
    expect: { state: ASK_DATE, say_contains: какой именно день }
  - user: в следующий вторник
    expect: { slots: { date: '2026-10-20' }, state: ASK_TIME }
  - user: в 15:00
    expect: { slots: { time: '15:00' }, state: ASK_CONTACT }
  - user: 8 916 234 56 78
    expect: { slots: { phone: '+79162345678' }, state: CONFIRM }
  - user: да
    expect: { state: DONE }
final:
  outcome: booked
  booking: { service: haircut, date: '2026-10-20', time: '15:00' }
