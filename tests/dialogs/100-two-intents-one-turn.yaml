id: '100-two-intents-one-turn'
title: Вопрос и запись в одной реплике
tags: [faq, booking, two-intents]
split: dev
now: '2026-10-15T12:00:00+03:00'
turns:
  - user: хочу записаться на стрижку и узнать цену
    expect: { state: RESUME, say_contains: ['2000', 'Продолжим запись'] }
  - user: да
    expect: { state: ASK_DATE }
  - user: завтра
    expect: { state: ASK_TIME }
  - user: в 15:00
    expect: { state: ASK_CONTACT }
  - user: 8 916 234 56 78
    expect: { state: ASK_NAME }
  - user: меня зовут Иван
    expect:
      slots: { name: Иван }
      state: CONFIRM
  - user: да
    expect: { state: DONE }
final:
  outcome: booked
  booking: { service: haircut, date: '2026-10-16', time: '15:00' }
