id: '034a-dirty-generated-1'
title: 'Запись одной фразой, искажённая ASR: пропущена буква'
tags: [booking, dirty]
split: dev
now: '2026-10-15T12:00:00+03:00'
turns:
  - user: здравствуйте хочу на мужскую стрижу завтра в 18:00
    expect:
      slots: { service: haircut, date: '2026-10-16', time: '18:00' }
      state: ASK_CONTACT
  - user: плюс семь девятьсот шестнадцать двести тридцать четыре пятьдесят шесть семьдесят восемь
    expect:
      slots: { phone: '+79162345678' }
      state: ASK_NAME
  - user: меня зовут Иван
    expect:
      slots: { name: Иван }
      state: CONFIRM
  - user: да
    expect: { state: DONE }
final:
  outcome: booked
  booking: { service: haircut, date: '2026-10-16', time: '18:00' }
