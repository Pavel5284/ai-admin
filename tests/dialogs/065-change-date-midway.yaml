id: '065-change-date-midway'
title: Клиент меняет дату посреди записи
tags: [edge, correction]
split: dev
now: '2026-10-15T12:00:00+03:00'
turns:
  - user: хочу на стрижку завтра
    expect: { slots: { service: haircut, date: '2026-10-16' }, state: ASK_TIME }
  - user: ой нет лучше в субботу
    expect: { slots: { date: '2026-10-17' }, state: ASK_TIME }
  - user: часа в три
    expect: { slots: { time: '15:00' }, state: ASK_CONTACT }
  - user: 8 916 234 56 78
    expect: { state: ASK_NAME }
  - user: меня зовут Иван
    expect:
      slots: { name: иван }
      state: CONFIRM
  - user: да
    expect: { state: DONE }
final:
  outcome: booked
  booking: { service: haircut, date: '2026-10-17', time: '15:00' }
