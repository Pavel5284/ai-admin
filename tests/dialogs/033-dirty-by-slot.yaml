id: '033-dirty-by-slot'
title: Грязные реплики по одному слоту
tags: [booking, dirty]
split: dev
now: '2026-10-15T12:00:00+03:00'
turns:
  - user: запишите меня пожалуйста
    expect: { state: ASK_SERVICE }
  - user: ну на подстричься
    expect: { slots: { service: haircut }, state: ASK_DATE }
  - user: эээ на послезавтра
    expect: { slots: { date: '2026-10-17' }, state: ASK_TIME }
  - user: где-то в 4 часа дня
    expect: { slots: { time: '16:00' }, state: ASK_CONTACT }
  - user: 8 916 234 56 78
    expect: { slots: { phone: '+79162345678' }, state: ASK_NAME }
  - user: меня зовут Иван
    expect:
      slots: { name: иван }
      state: CONFIRM
  - user: да
    expect: { state: DONE }
final:
  outcome: booked
  booking: { service: haircut, date: '2026-10-17', time: '16:00' }
