id: '119-account-reschedule'
title: Перенос записи по Telegram-аккаунту без запроса телефона
tags: [reschedule, privacy]
split: dev
telegram_id: 1001
now: '2026-10-15T12:00:00+03:00'
setup: |
  INSERT INTO bookings (master_id, service_id, starts_at, ends_at, client_name, client_phone,
                        client_telegram_id)
  SELECT m.id, s.id, '2026-10-16 12:00+03'::timestamptz,
         '2026-10-16 12:00+03'::timestamptz + make_interval(mins => s.duration_min),
         'Иван', '+79160000007', 1001
  FROM masters m JOIN services s ON s.code = 'haircut'
  WHERE m.name = 'Артём';
turns:
  - user: хочу перенести запись
    expect:
      state: ASK_DATE
      say_contains: 'Какой день'
      say_not_contains: 'номер телефона'
  - user: на субботу
    expect: { state: ASK_TIME, slots: { date: '2026-10-17' } }
  - user: в 12:00
    expect: { state: CONFIRM, say_contains: 'Переносим запись' }
  - user: да
    expect: { state: DONE }
final:
  outcome: rescheduled
  booking: none
  existing: { phone: '+79160000007', status: confirmed, date: '2026-10-17', time: '12:00' }
