id: '113-llm-down-range'
title: LLM недоступна, диапазон времени обрабатывают правила
tags: [system-failure, llm, range]
split: dev
now: '2026-10-15T12:00:00+03:00'
env:
  LLM_API_KEY: 'invalid-key-for-test'
  LLM_CACHE: '0'
turns:
  - user: мне бы завтра после обеда
    expect: { state: INTENT, slots: { date: '2026-10-16' } }
  - user: стрижка
    expect: { state: OFFER_SLOTS, slots: { service: haircut } }
  - user: первый
    expect: { state: ASK_CONTACT }
  - user: 8 916 234 56 78
    expect: { state: CONFIRM }
  - user: да
    expect: { state: DONE }
final:
  outcome: booked
  booking: { service: haircut, date: '2026-10-16' }
