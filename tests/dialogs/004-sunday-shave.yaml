id: '004-sunday-shave'
title: Бритьё в воскресенье, работает только Руслан
tags: [booking, perfect]
split: dev
now: '2026-10-15T12:00:00+03:00'
turns:
  - user: на королевское бритьё в воскресенье в 13:00
    expect:
      slots: { service: shave, date: '2026-10-18', time: '13:00' }
      state: ASK_CONTACT
  - user: +7 (916) 234-56-78
    expect: { slots: { phone: '+79162345678' }, state: ASK_NAME }
  - user: меня зовут Иван
    expect:
      slots: { name: Иван }
      state: CONFIRM
  - user: да
    expect: { state: DONE }
final:
  outcome: booked
  booking: { service: shave, date: '2026-10-18', time: '13:00' }
