id: '084-cancel-multiple-bookings'
title: Отмена при нескольких записях на один номер
tags: [reschedule, cancel, multiple]
split: dev
now: '2026-10-15T12:00:00+03:00'
setup: |
  INSERT INTO bookings (master_id, service_id, starts_at, ends_at, client_name, client_phone)
  SELECT m.id, s.id, '2026-10-18 12:00+03'::timestamptz,
         '2026-10-18 12:00+03'::timestamptz + make_interval(mins => s.duration_min),
         'Иван', '+79160000001'
  FROM masters m JOIN services s ON s.code = 'haircut'
  WHERE m.name = 'Артём';
turns:
  - user: хочу отменить запись
    expect: { state: FIND_BOOKING }
  - user: 8 916 000 00 01
    expect: { state: FIND_BOOKING, say_contains: 'несколько записей' }
  - user: '1'
    expect: { state: CONFIRM, say_contains: 'Отменяем запись' }
  - user: да
    expect: { state: DONE }
final:
  outcome: cancelled
  booking: none
  existing: { phone: '+79160000001', status: cancelled, date: '2026-10-16', time: '11:00' }
