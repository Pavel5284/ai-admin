services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: admin
      TZ: Europe/Moscow          # локальное время БД = часовой пояс бизнеса (D-006)
    ports: ['5432:5432']
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d admin']
      interval: 5s
      retries: 10

  mock-crm:
    build: ./mock-crm
    environment:
      CHAOS: ${CHAOS:-0}
    ports: ['4000:4000']

  bot:
    build: .
    profiles: ['bot']
    env_file: .env
    environment:
      DATABASE_URL: postgres://app:app@db:5432/admin
      CRM_URL: http://mock-crm:4000
    depends_on:
      db:
        condition: service_healthy
      mock-crm:
        condition: service_started
    restart: unless-stopped
