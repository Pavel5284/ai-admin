id: '069-change-phone-at-confirm'
title: Клиент меняет телефон на подтверждении
tags: [edge, correction]
split: dev
now: '2026-10-15T12:00:00+03:00'
turns:
  - user: хочу на стрижку завтра в 15:00
    expect: { state: ASK_CONTACT }
  - user: 8 916 234 56 78
    expect: { state: CONFIRM }
  - user: нет
    expect: { say_contains: 'услугу, дату, время' }
  - user: телефон
    expect: { state: ASK_CONTACT }
  - user: 8 916 000 11 22
    expect: { state: CONFIRM, slots: { phone: '+79160001122' } }
  - user: да
    expect: { state: DONE }
final:
  outcome: booked
  booking: { service: haircut, date: '2026-10-16', time: '15:00', phone: '+79160001122' }
