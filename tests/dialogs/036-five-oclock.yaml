id: '036-five-oclock'
title: «В пять» — это 17:00, дата уточняется отдельно
tags: [booking, ambiguous]
split: dev
now: '2026-10-15T12:00:00+03:00'
turns:
  - user: хочу на стрижку в пять
    expect: { slots: { service: haircut, time: '17:00' }, state: ASK_DATE }
  - user: в субботу
    expect: { slots: { date: '2026-10-17' }, state: ASK_CONTACT }
  - user: 8 916 234 56 78
    expect: { slots: { phone: '+79162345678' }, state: CONFIRM }
  - user: да
    expect: { state: DONE }
final:
  outcome: booked
  booking: { service: haircut, date: '2026-10-17', time: '17:00' }
