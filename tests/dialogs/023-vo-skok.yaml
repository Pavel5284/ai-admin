id: '023-vo-skok'
title: «Во скок» вместо «во сколько»
tags: [booking, dirty]
split: dev
now: '2026-10-15T12:00:00+03:00'
turns:
  - user: хочу подстричся во скок можно завтра
    expect:
      slots: { service: haircut, date: '2026-10-16' }
      state: ASK_TIME
  - user: в 15 30
    expect: { slots: { time: '15:30' }, state: ASK_CONTACT }
  - user: 916 234 56 78
    expect: { slots: { phone: '+79162345678' }, state: ASK_NAME }
  - user: меня зовут Иван
    expect:
      slots: { name: Иван }
      state: CONFIRM
  - user: да
    expect: { state: DONE }
final:
  outcome: booked
  booking: { service: haircut, date: '2026-10-16', time: '15:30' }
