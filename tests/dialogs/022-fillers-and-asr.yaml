id: '022-fillers-and-asr'
title: Паразиты и склейка «назавтра»
tags: [booking, dirty]
split: dev
now: '2026-10-15T12:00:00+03:00'
turns:
  - user: ну короче мне назавтра на стрижку часиков в шесть вечера
    expect:
      slots: { service: haircut, date: '2026-10-16', time: '18:00' }
      state: ASK_CONTACT
  - user: 8 916 234 56 78
    expect: { slots: { phone: '+79162345678' }, state: ASK_NAME }
  - user: меня зовут Иван
    expect:
      slots: { name: Иван }
      state: CONFIRM
  - user: да
    expect: { state: DONE }
final:
  outcome: booked
  booking: { service: haircut, date: '2026-10-16', time: '18:00' }
