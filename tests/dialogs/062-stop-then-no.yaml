id: '062-stop-then-no'
title: «Стоп» просит подтвердить отмену, «нет» возвращает к записи
tags: [edge, interruption]
split: dev
now: '2026-10-15T12:00:00+03:00'
turns:
  - user: хочу на стрижку завтра
    expect: { state: ASK_TIME }
  - user: стоп
    expect: { state: CONFIRM, say_contains: 'Отменить запись' }
  - user: нет
    expect: { state: ASK_TIME }
  - user: в 15:00
    expect: { state: ASK_CONTACT }
  - user: 8 916 234 56 78
    expect: { state: ASK_NAME }
  - user: меня зовут Иван
    expect:
      slots: { name: иван }
      state: CONFIRM
  - user: да
    expect: { state: DONE }
final:
  outcome: booked
  booking: { service: haircut, date: '2026-10-16', time: '15:00' }
