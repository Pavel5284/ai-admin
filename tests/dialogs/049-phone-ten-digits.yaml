id: '049-phone-ten-digits'
title: Телефон из десяти цифр без восьмёрки
tags: [booking, phone]
split: dev
now: '2026-10-15T12:00:00+03:00'
turns:
  - user: хочу на бороду в субботу в 12:00
    expect: { state: ASK_CONTACT }
  - user: '9162345678'
    expect: { slots: { phone: '+79162345678' }, state: ASK_NAME }
  - user: меня зовут Иван
    expect:
      slots: { name: иван }
      state: CONFIRM
  - user: да
    expect: { state: DONE }
final:
  outcome: booked
  booking: { service: beard, date: '2026-10-17', time: '12:00' }
