id: '048-phone-words'
title: Телефон целиком словами
tags: [booking, phone]
split: dev
now: '2026-10-15T12:00:00+03:00'
turns:
  - user: хочу на стрижку завтра в 18:00
    expect: { state: ASK_CONTACT }
  - user: восемь девятьсот шестнадцать двести тридцать четыре пятьдесят шесть семьдесят восемь
    expect: { slots: { phone: '+79162345678' }, state: ASK_NAME }
  - user: меня зовут Иван
    expect:
      slots: { name: иван }
      state: CONFIRM
  - user: да
    expect: { state: DONE }
final:
  outcome: booked
  booking: { service: haircut, date: '2026-10-16', time: '18:00' }
