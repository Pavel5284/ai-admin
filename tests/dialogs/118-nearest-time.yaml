id: '118-nearest-time'
title: «Когда есть ближайшее?» — сразу показываем свободные окна
tags: [booking, slots, nearest]
split: dev
now: '2026-10-15T12:00:00+03:00'
turns:
  - user: здравствуйте
    expect: { state: INTENT }
  - user: хочу на мужскую стрижку
    expect: { state: ASK_DATE, slots: { service: haircut } }
  - user: а когда есть время ближайшее? мне срочно
    expect:
      state: OFFER_SLOTS
      say_contains: 'Ближайшее свободное время'
      say_not_contains: 'Не совсем понял дату'
  - user: '1'
    expect: { state: ASK_CONTACT }
  - user: 8 916 234 56 78
    expect: { state: ASK_NAME }
  - user: меня зовут Иван
    expect:
      slots: { name: Иван }
      state: CONFIRM
  - user: да
    expect: { state: DONE }
final:
  outcome: booked
  booking: { service: haircut, date: '2026-10-15', time: '12:30' }
