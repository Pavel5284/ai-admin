id: '046-quarter-past-seven'
title: «В четверть восьмого» — 19:15
tags: [booking, ambiguous]
split: dev
now: '2026-10-15T12:00:00+03:00'
turns:
  - user: на стрижку в пятницу в четверть восьмого
    expect:
      slots: { service: haircut, date: '2026-10-16', time: '19:15' }
      state: ASK_CONTACT
  - user: 8 916 234 56 78
    expect: { slots: { phone: '+79162345678' }, state: ASK_NAME }
  - user: меня зовут Иван
    expect:
      slots: { name: Иван }
      state: CONFIRM
  - user: да
    expect: { state: DONE }
final:
  outcome: booked
  booking: { service: haircut, date: '2026-10-16', time: '19:15' }
