id: '074-date-in-past'
title: Дата в прошлом не попадает в слот
tags: [edge, date]
split: dev
now: '2026-10-15T12:00:00+03:00'
turns:
  - user: запишите меня
    expect: { state: ASK_SERVICE }
  - user: стрижка
    expect: { state: ASK_DATE }
  - user: вчера
    expect: { state: ASK_DATE, say_contains: 'уже прошла' }
  - user: завтра
    expect: { slots: { date: '2026-10-16' }, state: ASK_TIME }
final:
  booking: none
