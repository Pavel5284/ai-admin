id: '021-dirty-input'
title: Паразиты, цифры вперемешку, ошибки распознавания
tags: [booking, dirty]
split: dev
now: '2026-10-15T12:00:00+03:00'
turns:
  - user: ну эээ мне бы это подстричся на послезавтра часа в три
    expect:
      slots: { service: haircut, date: '2026-10-17', time: '15:00' }
      state: ASK_CONTACT
  - user: восемь 916 два три четыре пять шесть семь восемь
    expect:
      slots: { phone: '+79162345678' }
      state: CONFIRM
  - user: все верно
    expect:
      state: DONE
final:
  outcome: booked
  booking: { service: haircut, date: '2026-10-17', time: '15:00' }
