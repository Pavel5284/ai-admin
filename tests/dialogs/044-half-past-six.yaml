id: '044-half-past-six'
title: «В половине седьмого» — 18:30
tags: [booking, ambiguous]
split: dev
now: '2026-10-15T12:00:00+03:00'
turns:
  - user: хочу на стрижку в субботу в половине седьмого
    expect:
      slots: { service: haircut, date: '2026-10-17', time: '18:30' }
      state: ASK_CONTACT
  - user: 8 916 234 56 78
    expect: { slots: { phone: '+79162345678' }, state: ASK_NAME }
  - user: меня зовут Иван
    expect:
      slots: { name: иван }
      state: CONFIRM
  - user: да
    expect: { state: DONE }
final:
  outcome: booked
  booking: { service: haircut, date: '2026-10-17', time: '18:30' }
