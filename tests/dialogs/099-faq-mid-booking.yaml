id: '099-faq-mid-booking'
title: Вопрос из базы знаний посреди записи
tags: [faq, booking, resume]
split: dev
now: '2026-10-15T12:00:00+03:00'
turns:
  - user: хочу на стрижку завтра
    expect: { state: ASK_TIME }
  - user: а сколько стоит стрижка?
    expect: { state: RESUME, say_contains: ['2000', 'Продолжим запись'] }
  - user: да
    expect: { state: ASK_TIME }
  - user: в 15:00
    expect: { state: ASK_CONTACT }
  - user: 8 916 234 56 78
    expect: { state: CONFIRM }
  - user: да
    expect: { state: DONE }
final:
  outcome: booked
  booking: { service: haircut, date: '2026-10-16', time: '15:00' }
