id: '030-artem-without-yo'
title: Имя мастера без «ё» и время с половиной
tags: [booking, dirty]
split: dev
now: '2026-10-15T12:00:00+03:00'
turns:
  - user: запиши к Артему на стрижку в пятницу в 17:30
    expect:
      slots: { service: haircut, masterId: 1, date: '2026-10-16', time: '17:30' }
      state: ASK_CONTACT
  - user: 8 916 234 56 78
    expect: { slots: { phone: '+79162345678' }, state: ASK_NAME }
  - user: меня зовут Иван
    expect:
      slots: { name: иван }
      state: CONFIRM
  - user: да
    expect: { state: DONE }
final:
  outcome: booked
  booking: { service: haircut, date: '2026-10-16', time: '17:30' }
