id: '115-master-unknown-then-choose'
title: Неизвестный мастер на подтверждении — показываем список
tags: [edge, correction, master]
split: dev
now: '2026-10-15T12:00:00+03:00'
turns:
  - user: хочу на стрижку завтра в 15:00
    expect: { state: ASK_CONTACT }
  - user: 8 916 234 56 78
    expect: { state: ASK_NAME }
  - user: меня зовут Иван
    expect:
      slots: { name: иван }
      state: CONFIRM
  - user: хочу мастера Ивана
    expect:
      state: ASK_MASTER
      say_contains: ['Мастера «Ивана» нет', 'Артём']
  - user: к Диане
    expect: { state: CONFIRM, slots: { masterId: 3 } }
  - user: да
    expect: { state: DONE }
final:
  outcome: booked
  booking: { service: haircut, date: '2026-10-16', time: '15:00' }
