id: '031-ruslan-combo'
title: Комплекс к Руслану
tags: [booking, dirty]
split: dev
now: '2026-10-15T12:00:00+03:00'
turns:
  - user: хочу к Руслану на комплекс в субботу в 14:00
    expect:
      slots: { service: combo, masterId: 2, date: '2026-10-17', time: '14:00' }
      state: ASK_CONTACT
  - user: 8 916 234 56 78
    expect: { slots: { phone: '+79162345678' }, state: ASK_NAME }
  - user: меня зовут Иван
    expect:
      slots: { name: Иван }
      state: CONFIRM
  - user: да
    expect: { state: DONE }
final:
  outcome: booked
  booking: { service: combo, date: '2026-10-17', time: '14:00' }
