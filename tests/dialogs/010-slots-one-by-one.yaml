id: '010-slots-one-by-one'
title: Клиент отвечает по одному слоту за раз
tags: [booking, perfect]
split: dev
now: '2026-10-15T12:00:00+03:00'
turns:
  - user: запишите меня
    expect: { state: ASK_SERVICE }
  - user: на стрижку
    expect: { slots: { service: haircut }, state: ASK_DATE }
  - user: в воскресенье
    expect: { slots: { date: '2026-10-18' }, state: ASK_TIME }
  - user: в 15:00
    expect: { slots: { time: '15:00' }, state: ASK_CONTACT }
  - user: 8 916 234 56 78
    expect: { slots: { phone: '+79162345678' }, state: ASK_NAME }
  - user: меня зовут Иван
    expect:
      slots: { name: Иван }
      state: CONFIRM
  - user: да
    expect: { state: DONE }
final:
  outcome: booked
  booking: { service: haircut, date: '2026-10-18', time: '15:00' }
