id: '066-change-time-at-confirm'
title: Клиент меняет время на подтверждении
tags: [edge, correction]
split: dev
now: '2026-10-15T12:00:00+03:00'
turns:
  - user: хочу на стрижку завтра в 18:00
    expect: { state: ASK_CONTACT }
  - user: 8 916 234 56 78
    expect: { state: ASK_NAME }
  - user: меня зовут Иван
    expect:
      slots: { name: Иван }
      state: CONFIRM
  - user: нет
    expect: { say_contains: 'услугу, дату, время' }
  - user: время
    expect: { state: ASK_TIME }
  - user: в 19:00
    expect: { state: CONFIRM, slots: { time: '19:00' } }
  - user: да
    expect: { state: DONE }
final:
  outcome: booked
  booking: { service: haircut, date: '2026-10-16', time: '19:00' }
