id: '110-crm-down-booking'
title: CRM недоступна, запись всё равно создаётся
tags: [system-failure, crm, outbox]
split: dev
now: '2026-10-15T12:00:00+03:00'
env:
  CRM_URL: 'http://127.0.0.1:9'
turns:
  - user: хочу на стрижку завтра в 15:00
    expect: { state: ASK_CONTACT }
  - user: 8 916 234 56 78
    expect: { state: ASK_NAME }
  - user: меня зовут Иван
    expect:
      slots: { name: Иван }
      state: CONFIRM
  - user: да
    expect: { state: DONE, say_contains: 'записаны' }
final:
  outcome: booked
  booking: { service: haircut, date: '2026-10-16', time: '15:00' }
  outbox: lead
