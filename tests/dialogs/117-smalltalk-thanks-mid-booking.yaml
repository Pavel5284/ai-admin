id: '117-smalltalk-thanks-mid-booking'
title: Благодарность посреди записи не сбрасывает состояние
tags: [smalltalk, booking, state-preserved]
split: dev
now: '2026-10-15T12:00:00+03:00'
turns:
  - user: хочу записаться
    expect: { state: ASK_SERVICE }
  - user: стрижка
    expect: { slots: { service: haircut }, state: ASK_DATE }
  - user: спасибо
    expect: { state: ASK_DATE, say_contains: день }
  - user: завтра
    expect: { slots: { date: '2026-10-16' }, state: ASK_TIME }
  - user: в 18:00
    expect: { slots: { time: '18:00' }, state: ASK_CONTACT }
  - user: +7 916 111 22 44
    expect: { slots: { phone: '+79161112244' }, state: ASK_NAME }
  - user: Иван
    expect: { slots: { name: иван }, state: CONFIRM }
  - user: да
    expect: { state: DONE }
final:
  outcome: booked
  booking: { service: haircut, date: '2026-10-16', time: '18:00' }
